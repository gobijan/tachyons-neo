<!--
  Buttons — port of the v5 button demo
  Covers: default, primary, small, large, and icon-only button-like links.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — tachyons-neo demo</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../tachyons.css">
  <link rel="stylesheet" href="../app.css">
  <style>
    .button-glyph {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: .125em solid currentColor;
      border-radius: var(--radius-1);
      box-shadow: inset .25em .25em 0 var(--white-30);
    }
  </style>
</head>
<body class="pa4 pa5-ns sans-serif lh-copy bg-surface-base">

  <main class="root flex flex-column g4">
    <h1 class="f2 fw7 lh-title mt0 mb0">Buttons Playground</h1>

    <div class="flex flex-wrap g4">
      <a href="#" class="link ba lh-copy pointer bg-animate bg-surface-2 b--border-2 hover-b--border-3 hover-bg-surface-3 active-dim text-1 ph4 pv2 inline-flex items-center g2 flex-grow-0 self-start f5 br-pill shadow-1">
        <span class="button-glyph" aria-hidden="true"></span>
        Default
      </a>

      <a href="#" class="link bn lh-copy pointer bg-animate bg-dark-gray hover-bg-black active-dim white ph4 pv2 inline-flex items-center g2 flex-grow-0 self-start f5 br-pill">
        Primary
      </a>
    </div>

    <div class="flex flex-wrap g4">
      <a href="#" class="link bn lh-copy pointer bg-animate bg-light-gray hover-bg-moon-gray active-dim near-black ph3 pv2 inline-flex items-center g2 flex-grow-0 self-start f6 br-pill">
        Small
      </a>
    </div>

    <div class="flex flex-wrap g4">
      <a href="#" class="link bn lh-copy pointer bg-animate bg-light-gray hover-bg-moon-gray active-dim near-black ph5 pv3 inline-flex items-center g2 flex-grow-0 self-start f4 br-pill">
        <span class="button-glyph" aria-hidden="true"></span>
        Large
      </a>
    </div>

    <div class="flex flex-wrap g4">
      <a href="#" aria-label="Open cube" class="link bn lh-copy pointer bg-animate bg-light-gray hover-bg-moon-gray active-dim near-black pa2 inline-flex items-center justify-center flex-grow-0 self-start f4 br-pill">
        <span class="button-glyph" aria-hidden="true"></span>
      </a>
    </div>
  </main>

</body>
</html>
