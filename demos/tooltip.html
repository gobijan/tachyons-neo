<!--
  Tooltip — .hide-child/.child reveal · :focus-within · visibility + transition-behavior: allow-discrete
  Zero-JS. Rails-ready markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tooltip — tachyons-neo demo</title>
	<link rel="icon" href="../favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="../tachyons.css">
</head>

<body class="pa4 sans-serif antialiased bg-black-20">

	<span class="relative hide-child">
		<button aria-describedby="demo-tooltip" class="button-reset pv2 ph3 br3 bg-animate bg-white hover-bg-black-10 active-dim bn pointer fw5 f6">
			Hover to see tooltip.
		</button>
		<div id="demo-tooltip" role="tooltip" class="child absolute mt2 left-0 mb1 bg-black white f6 fw5 br3 pv1 ph2 nowrap">
			I am the tooltip.
		</div>
	</span>


</body>

</html>
