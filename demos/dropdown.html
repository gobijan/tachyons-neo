<!--
  Dropdown — Popover API · CSS Anchor Positioning · app.css .fade-y · allow-discrete
  Zero-JS. Rails-ready markup.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown — tachyons-neo demo</title>
  <link rel="stylesheet" href="../tachyons.css">
  <link rel="stylesheet" href="../app.css">
  <style>
    .dropdown-menu {
      position: absolute;
      position-anchor: var(--anchor);
      position-try-fallbacks: flip-block, flip-inline;
      inset: auto;
      top: anchor(bottom);
      left: anchor(left);
      margin: 0;
    }
  </style>
</head>
<body class="pa4 sans-serif bg-black-20">
  
  
  <!-- Dropdown 1 -->
  <div class="dib">
    <button
      popovertarget="dropdown-1"
      class="button-reset pv2 ph3 br4 bg-animate bg-white hover-bg-white-80 active-dim pointer fw4 f6 shadow-1 bn"
      style="anchor-name: --anchor-1;"
      aria-controls="dropdown-1"
    >
      Actions <span aria-hidden="true">▾</span>
    </button>

    <div
      id="dropdown-1"
      popover
      class="dropdown-menu fade-y pa2 bg-white shadow-3 br4 f6 fw5 bn"
      style="--anchor: --anchor-1;"
    >
      <a href="#" class="db pa2 no-underline dark-gray hover-bg-light-gray bg-animate br3 active-dim">Edit</a>
      <a href="#" class="db pa2 no-underline dark-gray hover-bg-light-gray bg-animate br3 active-dim">Duplicate</a>
      <a href="#" class="db pa2 no-underline dark-gray hover-bg-light-gray bg-animate br3 active-dim">Delete</a>
    </div>
  </div>

</body>
</html>
