<header class="ph3 ph4-ns pv3 flex flex-column flex-row-ns justify-between items-start items-baseline-ns g2 f6 ttu tracked fw7 bg-black white">
  <a href="{{ '/' | relative_url }}" class="link white underline-hover">Tachyons Neo</a>
  <div class="flex flex-wrap items-baseline g3">
    <nav class="flex flex-wrap items-baseline g3" aria-label="Primary">
      {% for item in site.data.nav %}
        {% assign is_current = false %}
        {% if item.match and page.url contains item.match %}
          {% assign is_current = true %}
        {% elsif page.url == item.url %}
          {% assign is_current = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}" class="link white underline-hover{% if is_current %} bb b--white{% endif %}"{% if is_current %} aria-current="location"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <a href="{{ site.github_url }}" class="link white underline-hover">GitHub</a>
    </nav>
    <span class="site-version tnum f7 fw4 white-60 nowrap pl3 bl b--white-20" aria-label="Version {{ site.version }}">v{{ site.version }}</span>
  </div>
</header>
