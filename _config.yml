title: Tachyons Neo
description: A small, composable CSS toolkit with modern viewport defaults, design tokens, grid helpers, and application UI tokens.
url: "https://tachyonsneo.com"
baseurl: ""
repository: gobijan/tachyons-neo
github_url: "https://github.com/gobijan/tachyons-neo"
upstream_url: "https://tachyons.io"
# Latest release; cdn_ref identifies the files described by this documentation.
version: "3.0.0"
cdn_ref: "v3.0.0"
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty

defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: doc

exclude:
  - .bundle/
  - .github/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - bin/
  - README.md
  - scripts/
  - output/
  - vendor/
