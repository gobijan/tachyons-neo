name: Deploy Jekyll site to Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Check CSS, documentation, and site
        run: bin/check

      - name: Check browser behavior
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/neo-server.log 2>&1 &
          neo_server_pid=$!
          neo_browser() { npx --yes --package @playwright/cli@0.1.20 playwright-cli -s=neo-check "$@"; }
          cleanup() { neo_browser close || true; kill "$neo_server_pid" || true; }
          trap cleanup EXIT
          neo_browser open http://127.0.0.1:4173/ --browser chrome
          neo_browser run-code --filename scripts/browser-check.js

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
